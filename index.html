<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bharathi Priya</title>

<link rel="stylesheet" href="css/style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

<!-- ========================= -->
<!-- BOOT SCREEN -->
<!-- ========================= -->

<div id="bootScreen">

    <div class="bootLogo">

        <h1>Project BP OS</h1>

        <p>Starting System...</p>

        <div class="progressBar">

            <div class="progressFill"></div>

        </div>

        <span id="bootText">

            Booting...

        </span>

    </div>

</div>


<!-- ========================= -->
<!-- MAIN OS -->
<!-- ========================= -->

<div id="osContainer">

    <!-- TOP BAR -->

    <header class="topBar">

        <div class="leftTop">

            <img src="assets/icons/folder.svg" class="smallIcon">

            <span>Project BP OS</span>

        </div>

        <div class="rightTop">

            <span id="clock">12:32</span>

        </div>

    </header>


    <!-- DESKTOP -->

    <main class="desktop">


        <div class="appIcon" data-app="gallery">

            <img src="assets/icons/gallery.svg">

            <p>Gallery</p>

        </div>


        <div class="appIcon" data-app="calendar">

            <img src="assets/icons/calendar.svg">

            <p>Calendar</p>

        </div>


        <div class="appIcon" data-app="music">

            <img src="assets/icons/music.svg">

            <p>Music</p>

        </div>


        <div class="appIcon" data-app="sky">

            <img src="assets/icons/sky.svg">

            <p>Sky</p>

        </div>


        <div class="appIcon" data-app="puzzle">

            <img src="assets/icons/puzzle.svg">

            <p>Puzzle</p>

        </div>


        <div class="appIcon" data-app="cinema">

            <img src="assets/icons/cinema.svg">

            <p>Cinema</p>

        </div>

    </main>


    <!-- TASKBAR -->

    <footer class="taskBar">

        <div class="taskLeft">

            <img src="assets/icons/folder.svg">

        </div>

        <div class="taskCenter">

            <span>Project BP OS</span>

        </div>

        <div class="taskRight">

            <img src="assets/icons/music.svg">

            <span id="battery">

                100%

            </span>

        </div>

    </footer>

</div>


<script src="js/script.js"></script>

</body>

</html>
